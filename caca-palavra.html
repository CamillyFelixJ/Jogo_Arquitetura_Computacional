<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Bangers&family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="icon" href="imgtag.PNG">
    <link rel="stylesheet" href="tema.css">
    <title>Caça-Palavras - Arquitetura Computacional</title>
    <style>
        .dicas-lista {
            display: flex;
            flex-direction: column;
            gap: 0.55rem;
            max-height: 460px;
            overflow-y: auto;
            padding-right: 0.25rem;
        }

        .dica-card {
            background: var(--navy);
            border-left: 4px solid var(--y);
            border-radius: 10px;
            padding: 0.55rem 0.75rem;
            font-size: 0.88rem;
            line-height: 1.35;
            color: #f8fafc;
            transition: background-color 0.2s, border-color 0.2s, opacity 0.2s;
        }

        .dica-card strong {
            color: var(--y);
            margin-right: 0.25rem;
        }

        .dica-card.done {
            background: var(--ok);
            border-left-color: #0f7a43;
            color: #fff;
        }

        .dica-card.done strong {
            color: #fff;
            text-decoration: line-through;
        }

        .aviso-rodada {
            margin-top: 0.7rem;
            padding: 0.55rem 0.8rem;
            border-radius: 10px;
            background: var(--y);
            color: var(--ink);
            border: 3px solid var(--navy);
            font-weight: 700;
            font-size: 0.9rem;
            text-align: center;
            display: none;
        }

        .aviso-rodada.visivel {
            display: block;
        }
    </style>
</head>

<body>
    <header class="topo">
        <div class="logo"></div>
        <div>
            <span class="badge">SPRINT 3 • ARQUITETURA COMPUTACIONAL</span>
            <h1>CAÇA-<span>PALAVRAS</span></h1>
        </div>
        <img class="mascote" src="img/minion.png" alt="" onerror="this.remove()">
        <div class="lado">
            <div class="placar" id="placar">ENCONTRADAS: 0 DE 13</div>
            <div class="pista"><i id="kart">🏎️</i><b>🏁</b></div>
            <nav>
                <a class="btn" href="index.html">CRUZADINHA</a>
                <span class="btn ativo">CAÇA-PALAVRAS</span>
                <a class="btn" href="flashcard.html">FLASHCARDS</a>
                <button id="limpar" class="btn red">LIMPAR SELEÇÃO</button>
            </nav>
        </div>
    </header>

    <main class="arena">
        <section class="painel">
            <h2>🍌 TABULEIRO</h2>
            <div id="tab" class="tab"></div>
            <p class="dica">Leia a dica ao lado, descubra a palavra e clique letra por letra no tabuleiro.</p>
            <div id="aviso" class="aviso-rodada"></div>
        </section>
        <aside class="painel">
            <h2>DICAS DAS PALAVRAS</h2>
            <div id="lista" class="dicas-lista"></div>
        </aside>
    </main>

    <script>
        const S = 14, P = [
            ["CPU", "Unidade central que busca, decodifica e executa instruções."],
            ["ULA", "Faz operações matemáticas e comparações lógicas dentro do processador."],
            ["CACHE", "Memória ultrarrápida entre a CPU e a RAM para acesso imediato."],
            ["FLASH", "Memória não volátil regravável muito usada em SSDs e pendrives."],
            ["RAM", "Memória volátil que guarda dados temporários dos programas em execução."],
            ["ROM", "Memória não volátil com instruções permanentes de inicialização."],
            ["DUALCORE", "Processador que possui dois núcleos de execução no mesmo chip."],
            ["QUADCORE", "Processador que reúne quatro núcleos de execução."],
            ["DMA", "Permite que periféricos acessem a memória direto sem sobrecarregar a CPU."],
            ["BARRAMENTO", "Conjunto de vias físicas que transporta sinais e dados entre componentes."],
            ["BIOS", "Firmware básico que inicializa e testa o hardware ao ligar o PC."],
            ["CLOCK", "Pulso de sincronismo que dita o ritmo das operações do processador."],
            ["SSD", "Unidade de armazenamento sólido mais rápida que um HD mecânico."]
        ];

        const A = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";
        const tab = document.getElementById("tab");
        const lista = document.getElementById("lista");
        const aviso = document.getElementById("aviso");
        tab.style.gridTemplateColumns = "repeat(14,var(--s))";
        tab.style.setProperty("--s", "clamp(20px,5.6vw,36px)");

        let sel = [], ach = new Set(), rodada = 1, timerAviso = null;

        function criarGradeAleatoria() {
            const ordenadas = [...P].sort((a, b) => b[0].length - a[0].length);

            for (let tentativa = 0; tentativa < 250; tentativa++) {
                const grade = Array.from({ length: S }, () => Array(S).fill(""));
                let ok = true;

                for (const [palavra] of ordenadas) {
                    const candidatos = [];
                    for (let r = 0; r < S; r++) {
                        for (let c = 0; c < S; c++) {
                            for (const dir of ["H", "V"]) {
                                const endR = r + (dir === "V" ? palavra.length - 1 : 0);
                                const endC = c + (dir === "H" ? palavra.length - 1 : 0);
                                if (endR >= S || endC >= S) continue;

                                let cabe = true;
                                for (let i = 0; i < palavra.length; i++) {
                                    const y = r + (dir === "V" ? i : 0);
                                    const x = c + (dir === "H" ? i : 0);
                                    if (grade[y][x] && grade[y][x] !== palavra[i]) {
                                        cabe = false;
                                        break;
                                    }
                                }
                                if (cabe) candidatos.push([r, c, dir]);
                            }
                        }
                    }

                    if (!candidatos.length) {
                        ok = false;
                        break;
                    }

                    const [r, c, dir] = candidatos[(Math.random() * candidatos.length) | 0];
                    for (let i = 0; i < palavra.length; i++) {
                        const y = r + (dir === "V" ? i : 0);
                        const x = c + (dir === "H" ? i : 0);
                        grade[y][x] = palavra[i];
                    }
                }

                if (ok) {
                    grade.forEach((linha, r) => linha.forEach((v, c) => {
                        if (!v) grade[r][c] = A[(Math.random() * 26) | 0];
                    }));
                    return grade;
                }
            }

            throw "Não foi possível gerar um tabuleiro válido.";
        }

        function montarDicas() {
            lista.innerHTML = "";
            P.forEach(([t, dica], idx) => {
                const card = document.createElement("div");
                card.className = "dica-card";
                card.id = "w-" + t;
                card.dataset.dica = dica;
                card.innerHTML = `<strong>#${idx + 1}</strong> <span>${dica}</span>`;
                lista.appendChild(card);
            });
        }

        function placar() {
            document.getElementById("placar").textContent = "ENCONTRADAS: " + ach.size + " DE " + P.length;
            document.getElementById("kart").style.left = "calc(" + (ach.size / P.length) + " * (100% - 38px) + 4px)";
        }

        function limpar() {
            sel.forEach(e => e.classList.remove("sel"));
            sel = [];
        }

        function mostrarAviso(texto) {
            clearTimeout(timerAviso);
            aviso.textContent = texto;
            aviso.classList.add("visivel");
            timerAviso = setTimeout(() => aviso.classList.remove("visivel"), 4500);
        }

        function iniciarRodada(completouAnterior = false) {
            sel = [];
            ach = new Set();
            tab.innerHTML = "";
            montarDicas();
            placar();

            const m = criarGradeAleatoria();
            m.forEach(l => l.forEach(ch => {
                const e = document.createElement("div");
                e.className = "c l";
                e.textContent = ch;
                e.onclick = () => {
                    const i = sel.indexOf(e);
                    if (i > -1) { sel.splice(i, 1); e.classList.remove("sel"); return; }
                    e.classList.add("sel");
                    sel.push(e);

                    const f = sel.map(x => x.textContent).join("");
                    const b = [...f].reverse().join("");
                    const w = P.find(p => !ach.has(p[0]) && (p[0] === f || p[0] === b));

                    if (w) {
                        ach.add(w[0]);
                        sel.forEach(x => { x.classList.remove("sel"); x.classList.add("found"); });
                        sel = [];

                        const card = document.getElementById("w-" + w[0]);
                        card.classList.add("done");
                        card.querySelector("span").textContent = `${w[0]} — ${card.dataset.dica}`;
                        placar();

                        if (ach.size === P.length) {
                            rodada++;
                            setTimeout(() => {
                                iniciarRodada(true);
                            }, 900);
                        }
                    }
                };
                tab.appendChild(e);
            }));

            if (completouAnterior) {
                mostrarAviso(`🎉 Parabéns! Todas as 13 palavras foram encontradas. Novo tabuleiro embaralhado (Rodada ${rodada})!`);
            }
        }

        document.getElementById("limpar").onclick = limpar;
        iniciarRodada(false);
    </script>
</body>

</html>

<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><link href="https://fonts.googleapis.com/css2?family=Bangers&family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet"><link rel="icon" href="imgtag.PNG"><link rel="stylesheet" href="tema.css"><title>Caça-Palavras - Arquitetura Computacional</title></head><body>
<header class="topo"><div class="logo"></div><div><span class="badge">SPRINT 3 • ARQUITETURA COMPUTACIONAL</span><h1>CAÇA-<span>PALAVRAS</span></h1></div><img class="mascote" src="img/minion.png" alt="" onerror="this.remove()"><div class="lado"><div class="placar" id="placar">ENCONTRADAS: 0 DE 8</div><div class="pista"><i id="kart">🏎️</i><b>🏁</b></div><nav><a class="btn" href="index.html">CRUZADINHA</a>
<span class="btn ativo">CAÇA-PALAVRAS</span>
<a class="btn" href="flashcard.html">FLASHCARDS</a><button id="limpar" class="btn red">LIMPAR SELEÇÃO</button></nav></div></header>
<main class="arena"><section class="painel"><h2>🍌 TABULEIRO</h2><div id="tab" class="tab"></div>
<p class="dica">Clique na primeira letra e vá clicando até a última. Vale de trás para frente também.</p></section>
<aside class="painel"><h2>PALAVRAS PARA ENCONTRAR</h2><div id="lista" class="lista"></div></aside></main>
<script>
const S=14,P=[["CPU",0,0,"H"],["ULA",2,0,"V"],["CACHE",1,4,"H"],["FLASH",3,10,"V"],["RAM",9,2,"H"],["ROM",9,2,"V"],["DUALCORE",12,4,"H"],["QUADCORE",2,13,"V"]];
const m=Array.from({length:S},()=>Array(S).fill(""));
P.forEach(([t,r,c,d])=>[...t].forEach((ch,i)=>{const y=r+(d=="V"?i:0),x=c+(d=="H"?i:0);if(m[y][x]&&m[y][x]!=ch)throw"conflito em "+t;m[y][x]=ch}));
const A="ABCDEFGHIJKLMNOPQRSTUVWXYZ";m.forEach(l=>l.forEach((v,i)=>{if(!v)l[i]=A[Math.random()*26|0]}));
const tab=document.getElementById("tab");tab.style.gridTemplateColumns="repeat(14,var(--s))";tab.style.setProperty("--s","clamp(20px,5.6vw,36px)");
let sel=[],ach=new Set;
P.forEach(([t])=>{const s=document.createElement("span");s.className="pill";s.id="w-"+t;s.textContent=t;document.getElementById("lista").appendChild(s)});
function placar(){document.getElementById("placar").textContent="ENCONTRADAS: "+ach.size+" DE "+P.length;
 document.getElementById("kart").style.left="calc("+(ach.size/P.length)+" * (100% - 38px) + 4px)"}
function limpar(){sel.forEach(e=>e.classList.remove("sel"));sel=[]}
m.forEach((l,r)=>l.forEach((ch,c)=>{const e=document.createElement("div");e.className="c l";e.textContent=ch;
 e.onclick=()=>{const i=sel.indexOf(e);if(i>-1){sel.splice(i,1);e.classList.remove("sel");return}
  e.classList.add("sel");sel.push(e);const f=sel.map(x=>x.textContent).join(""),b=[...f].reverse().join("");
  const w=P.find(p=>!ach.has(p[0])&&(p[0]==f||p[0]==b));
  if(w){ach.add(w[0]);sel.forEach(x=>{x.classList.remove("sel");x.classList.add("found")});sel=[];document.getElementById("w-"+w[0]).classList.add("done");placar()}};
 tab.appendChild(e)}));
document.getElementById("limpar").onclick=limpar;placar();
</script></body></html>

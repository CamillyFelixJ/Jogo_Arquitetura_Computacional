<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://fonts.googleapis.com/css2?family=Bangers&family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="tema.css">
  <title>Cruzadinha - Arquitetura Computacional</title>
</head>
<body>
  <header class="topo">
    <img class="mascote" src="minion.png" alt="Turma dos Minions" onerror="this.remove()">
    <div>
      <span class="badge">SPRINT 3 • ARQUITETURA COMPUTACIONAL</span>
      <h1>CRUZADINHA <span>RUSH!</span></h1>
    </div>

    <div class="lado">
      <div class="placar" id="placar">0 de 12 palavras</div>
      <div class="pista"><i id="kart">🏎️</i><b>🏁</b></div>
      <nav>
        <span class="btn ativo">CRUZADINHA</span>
        <a class="btn" href="caca-palavra.html">CAÇA-PALAVRAS</a>
        <a class="btn" href="flashcard.html">FLASHCARDS</a>
        <button id="conferir" class="btn go">CONFERIR</button>
        <button id="reiniciar" class="btn red">REINICIAR</button>
      </nav>
    </div>
  </header>

  <main class="arena">
    <section class="painel">
      <h2>🍌 TABULEIRO</h2>
      <div id="tab" class="tab"></div>
      <div class="leg">
        <span><i style="background:var(--ok)"></i>Correta</span>
        <span><i style="background:var(--bad)"></i>Incorreta</span>
      </div>
    </section>

    <aside class="pistas">
      <div class="painel">
        <h2>➔ HORIZONTAIS</h2>
        <ul id="ph"></ul>
      </div>
      <div class="painel">
        <h2>⬇ VERTICAIS</h2>
        <ul id="pv"></ul>
      </div>
    </aside>
  </main>

  <script>
    const DADOS = [
      ["MICROCONTROLADOR", "Chip único que reúne processador, memória e portas de entrada e saída."],
      ["REGISTRADORES", "Pequenas memórias internas do processador que guardam dados de uso imediato."],
      ["DUALCORE", "Processador com dois núcleos independentes de execução no mesmo chip."],
      ["QUADCORE", "Processador que reúne quatro núcleos de execução no mesmo encapsulamento."],
      ["DATABUS", "Via bidirecional por onde circulam os dados lidos ou escritos na memória."],
      ["CACHE", "Memória intermediária ultrarrápida que guarda cópias de dados acessados com frequência."],
      ["FLASH", "Memória não volátil regravável usada em pendrives e unidades sólidas."],
      ["RAM", "Memória volátil de trabalho que armazena dados e programas em execução."],
      ["ROM", "Memória não volátil que mantém instruções permanentes gravadas de fábrica."],
      ["CPU", "Componente central que busca, decodifica e executa as instruções dos programas."],
      ["ULA", "Parte do processador que executa cálculos matemáticos e comparações lógicas."],
      ["DMA", "Permite que periféricos transfiram dados com a memória sem ocupar o processador."]
    ];

    function gerarCruzadinha(itens) {
      for (let tentativa = 0; tentativa < 300; tentativa++) {
        const grade = {};
        const colocadas = [];
        const primeira = itens[0];
        const dirInicial = tentativa % 2 === 0 ? "H" : "V";

        for (let i = 0; i < primeira[0].length; i++) {
          const r = dirInicial === "V" ? i : 4;
          const c = dirInicial === "H" ? i : 4;
          grade[r + "-" + c] = primeira[0][i];
        }
        colocadas.push({
          p: primeira[0],
          t: primeira[1],
          d: dirInicial,
          r: dirInicial === "V" ? 0 : 4,
          c: dirInicial === "H" ? 0 : 4
        });

        let falhou = false;
        for (let idx = 1; idx < itens.length; idx++) {
          const [palavra, pista] = itens[idx];
          const candidatos = [];

          for (const w of colocadas) {
            const novaDir = w.d === "H" ? "V" : "H";
            for (let i = 0; i < palavra.length; i++) {
              for (let j = 0; j < w.p.length; j++) {
                if (palavra[i] !== w.p[j]) continue;

                const cr = w.r + (w.d === "V" ? j : 0);
                const cc = w.c + (w.d === "H" ? j : 0);
                const startR = cr - (novaDir === "V" ? i : 0);
                const startC = cc - (novaDir === "H" ? i : 0);

                if (startR < 0 || startC < 0) continue;

                let cabe = true;
                for (let k = 0; k < palavra.length; k++) {
                  const rr = startR + (novaDir === "V" ? k : 0);
                  constCC = startC + (novaDir === "H" ? k : 0);
                  const key = rr + "-" + constCC;
                  if (grade[key] && grade[key] !== palavra[k]) {
                    cabe = false;
                    break;
                  }
                }
                if (cabe) candidatos.push({ r: startR, c: startC, d: novaDir });
              }
            }
          }

          if (!candidatos.length) {
            falhou = true;
            break;
          }

          const escolhido = candidatos[(Math.random() * candidatos.length) | 0];
          for (let k = 0; k < palavra.length; k++) {
            const rr = escolhido.r + (escolhido.d === "V" ? k : 0);
            const cc = escolhido.c + (escolhido.d === "H" ? k : 0);
            grade[rr + "-" + cc] = palavra[k];
          }
          colocadas.push({ p: palavra, t: pista, d: escolhido.d, r: escolhido.r, c: escolhido.c });
        }

        if (!falhou) {
          let maxR = 0, maxC = 0;
          Object.keys(grade).forEach(k => {
            const [rr, cc] = k.split("-").map(Number);
            maxR = Math.max(maxR, rr);
            maxC = Math.max(maxC, cc);
          });
          return { W: colocadas, g: grade, max: [maxR, maxC] };
        }
      }
      throw new Error("Não foi possível montar o tabuleiro sem conflito.");
    }

    const { W, g, max } = gerarCruzadinha(DADOS);

    const nums = {};
    let n = 0;
    [...W].sort((a, b) => a.r - b.r || a.c - b.c).forEach(w => {
      const k = w.r + "-" + w.c;
      if (!nums[k]) nums[k] = ++n;
      w.n = nums[k];
    });

    const tab = document.getElementById("tab"), I = {};
    tab.style.gridTemplateColumns = `repeat(${max[1] + 1},var(--s))`;
    tab.style.setProperty("--s", "clamp(22px,5.2vw,38px)");

    for (let r = 0; r <= max[0]; r++) {
      for (let c = 0; c <= max[1]; c++) {
        const k = r + "-" + c, d = document.createElement("div");
        d.className = "c";
        if (!g[k]) {
          d.classList.add("vazio");
        } else {
          if (nums[k]) d.innerHTML = '<span class="num">' + nums[k] + '</span>';
          const i = document.createElement("input");
          i.maxLength = 1;
          I[k] = i;
          i.oninput = () => {
            i.value = i.value.replace(/[^a-zA-Z]/g, "").toUpperCase();
            i.classList.remove("correct", "wrong");
            if (i.value) {
              const a = I[r + "-" + (c + 1)], b = I[(r + 1) + "-" + c];
              (a && !a.value ? a : b && !b.value ? b : a || b)?.focus();
            }
          };
          i.onkeydown = e => {
            const m = { ArrowRight: [0, 1], ArrowLeft: [0, -1], ArrowDown: [1, 0], ArrowUp: [-1, 0] }[e.key];
            if (m) I[(r + m[0]) + "-" + (c + m[1])]?.focus();
            else if (e.key == "Backspace" && !i.value) (I[r + "-" + (c - 1)] || I[(r - 1) + "-" + c])?.focus();
          };
          d.appendChild(i);
        }
        tab.appendChild(d);
      }
    }

    W.sort((a, b) => a.n - b.n).forEach(w => {
      const li = document.createElement("li");
      li.innerHTML = "<strong>" + w.n + ".</strong> " + w.t;
      document.getElementById(w.d == "H" ? "ph" : "pv").appendChild(li);
    });

    const cells = w => [...w.p].map((ch, i) => [(w.r + (w.d == "V" ? i : 0)) + "-" + (w.c + (w.d == "H" ? i : 0)), ch]);

    function placar(a) {
      document.getElementById("placar").textContent = a == W.length ? "🏆 CORRIDA VENCIDA! " + a + " de " + W.length : a + " de " + W.length + " palavras";
      document.getElementById("kart").style.left = "calc(" + (a / W.length) + " * (100% - 38px) + 4px)";
    }

    document.getElementById("conferir").onclick = () => {
      let a = 0;
      Object.values(I).forEach(i => i.classList.remove("correct", "wrong"));
      const ok = new Set, bad = new Set;
      W.forEach(w => {
        const cs = cells(w);
        if (cs.every(([k, ch]) => I[k].value == ch)) {
          a++;
          cs.forEach(([k]) => ok.add(k));
        } else {
          cs.forEach(([k]) => I[k].value && bad.add(k));
        }
      });
      bad.forEach(k => I[k].classList.add("wrong"));
      ok.forEach(k => {
        I[k].classList.remove("wrong");
        I[k].classList.add("correct");
      });
      placar(a);
    };

    document.getElementById("reiniciar").onclick = () => {
      Object.values(I).forEach(i => {
        i.value = "";
        i.classList.remove("correct", "wrong");
      });
      placar(0);
    };
  </script>
</body>
</html>
